<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c12"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="60%">
      <stop offset="0" stop-color="#b91c1c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="100%" r="55%">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200 M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(90, 90)">
    <rect width="92" height="92" rx="22" fill="#b91c1c"/>
    <text x="46" y="50" dominant-baseline="central" text-anchor="middle"
      font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">CD</text>
  </g>
  <text x="200" y="150" font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">
    Cozelos<tspan fill="#ef4444">.</tspan>Data
  </text>

  <!-- headline -->
  <text x="90" y="330" font-family="Manrope, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Professional Websites,</text>
  <text x="90" y="420" font-family="Manrope, Arial, sans-serif" font-size="76" font-weight="800" fill="#ef4444">Marketing &amp; Digital</text>

  <!-- subhead -->
  <text x="92" y="500" font-family="Inter, Arial, sans-serif" font-size="32" fill="#cbd5e1">Premium digital agency · Vernal, Utah</text>

  <!-- credentials strip -->
  <text x="92" y="565" font-family="Geist Mono, monospace" font-size="24" fill="#94a3b8">WOSB · Websites · SEO · Video · Marketing · Automation</text>
</svg>
